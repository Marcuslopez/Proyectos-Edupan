name: Publicar mockup de donación

on:
  push:
    branches:
      - main
    paths:
      - "Proyecto_corneas/Mockups/**"
      - ".github/workflows/deploy-mockup.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos del mockup
        uses: actions/upload-pages-artifact@v3
        with:
          path: Proyecto_corneas/Mockups

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4